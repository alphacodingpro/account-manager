name: Accounting quality checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Type checks
        run: npm run typecheck
      - name: API and document regression tests
        run: npm test
      - name: Isolated accounting database tests
        run: npm run test:db
      - name: Production builds
        run: npm run build
